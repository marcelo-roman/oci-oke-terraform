name: terraform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: make fmt-check

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - .
          - modules/network
          - modules/oke-cluster
          - modules/oke-node-pool
          - modules/oci-vault
          - modules/traefik
          - modules/cert-manager
          - modules/metrics-server
          - modules/cloudnative-pg
          - modules/external-secrets
          - modules/argocd
          - modules/argo-rollouts
          - modules/argo-workflows
          - modules/keycloak
          - modules/monitoring
          - examples/always-free
          - examples/platform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform -chdir=${{ matrix.dir }} init -backend=false -input=false
      - run: terraform -chdir=${{ matrix.dir }} validate

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
      - run: make lint
        env:
          GITHUB_TOKEN: ${{ github.token }}

  docs:
    runs-on: ubuntu-latest
    env:
      TERRAFORM_DOCS_VERSION: v0.24.0
    steps:
      - uses: actions/checkout@v7
      - run: |
          curl -sSLo terraform-docs.tar.gz "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          sudo tar -xzf terraform-docs.tar.gz -C /usr/local/bin terraform-docs
          rm terraform-docs.tar.gz
      - run: make docs-check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: "1"
